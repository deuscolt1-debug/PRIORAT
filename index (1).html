<style>
:root{--ink:#272820;--wine:#6f263d;--rust:#b85c3c;--olive:#59633b;--cream:#f5f0e4;--paper:#fffdf8;--muted:#756f63;--line:#e4dccd;--gold:#c49a55;--ok:#e4ecd3;--okt:#3d4a22;--bad:#f6dfd6;--badt:#8a3a22}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#3b1a26,#6f263d);color:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;font-family:Arial,sans-serif;box-shadow:0 4px 18px #3b1a2644}
.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.score{display:flex;align-items:center;gap:8px;font-size:12px}
.score b{font-size:15px;color:var(--gold)}
main{max-width:660px;margin:0 auto;padding:16px 14px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#2a1520;border-top:1px solid #ffffff22;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:#cfc8b8;padding:10px 4px 9px;font:11px Arial,sans-serif;letter-spacing:.04em}
.nav button span{display:block;font-size:19px;margin-bottom:2px}
.nav button.on{color:#fff;background:#ffffff14;box-shadow:inset 0 3px 0 var(--rust)}
h1{font-size:clamp(38px,11vw,58px);line-height:1;font-weight:400;margin:10px 0 14px}
h2{font-size:28px;font-weight:400;line-height:1.1;margin:6px 0 12px}
h3{font-size:20px;font-weight:400;line-height:1.3;margin:6px 0 12px}
.kicker{font:11px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--rust)}
.lead{font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.card p{margin:6px 0;line-height:1.5;color:var(--muted)}
.hero{background:linear-gradient(160deg,#6f263d,#3b1a26 70%);color:#fff;border-radius:18px;padding:28px 22px;margin-bottom:14px}
.hero .lead{color:#f1e6dc}
.hero .kicker{color:var(--gold)}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;font-size:16px}
textarea{min-height:76px;resize:vertical;font-family:Arial,sans-serif}
label.f{display:block;font:12px Arial,sans-serif;color:var(--muted);margin:10px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.btn{display:inline-block;border:0;background:var(--rust);color:#fff;border-radius:99px;padding:13px 20px;font:600 14px Arial,sans-serif;text-align:center;text-decoration:none}
.btn.wine{background:var(--wine)}
.btn.block{display:block;width:100%;margin-top:10px}
.btn[disabled]{opacity:.5}
.ghost{border:1px solid var(--wine);background:transparent;color:var(--wine);border-radius:99px;padding:9px 14px;font:13px Arial,sans-serif;text-decoration:none;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:0 0 14px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 6px;font:13px Arial,sans-serif}
.tabs button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.stop{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.stop .ic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:22px;border:2px solid var(--line)}
.stop.done .ic{border-color:var(--olive);background:var(--ok)}
.stop .tm{font:700 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--rust)}
.stop .tt{font-size:18px;margin:2px 0}
.stop .pg{font:12px Arial,sans-serif;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),var(--gold))}
.dots{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font:12px Arial,sans-serif}
.dots button.on{border-color:var(--wine);background:var(--wine);color:#fff}
.dots button.ok{background:var(--ok);border-color:var(--olive);color:var(--okt)}
.dots button.on.ok{background:var(--olive);color:#fff}
.qtag{font:11px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--rust)}
.turn{display:inline-block;margin:8px 0 0;border:1px dashed var(--gold);background:#fbf5e6;border-radius:99px;padding:6px 12px;font:13px Arial,sans-serif}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:16px;line-height:1.35}
.opt:active:not([disabled]){background:var(--cream)}
.opt.ok{background:var(--ok);border-color:var(--olive);color:var(--okt)}
.opt.bad{background:var(--bad);border-color:var(--rust);color:var(--badt)}
.why{margin-top:12px;padding:12px 14px;border-radius:12px;font:14px/1.5 Arial,sans-serif}
.why.good{background:var(--ok);color:var(--okt)}
.why.miss{background:var(--bad);color:var(--badt)}
.why.info{background:#f2ece0;color:var(--muted);border-left:3px solid var(--gold);border-radius:0 12px 12px 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font:15px/1.4 Arial,sans-serif}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--olive);margin-top:1px}
.chk small{display:block;color:var(--muted);margin-top:4px;font-size:12.5px;line-height:1.45}
.pts{margin-left:auto;flex:none;font:700 12px Arial,sans-serif;color:var(--rust)}
.ord{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;background:#fff;font:15px/1.35 Arial,sans-serif}
.ord.right{background:var(--ok);border-color:var(--olive)}
.ord span{flex:1}
.ord button{border:1px solid var(--line);background:var(--cream);border-radius:8px;width:36px;height:36px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font:13px Arial,sans-serif}
.chips button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cell{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px;font:12.5px/1.25 Arial,sans-serif;display:grid;place-items:center;text-align:center}
.cell.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.big{font-size:40px;line-height:1;color:var(--wine)}
.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.sb div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.sb b{display:block;font-size:30px;color:var(--wine)}
.sb small{font:11px Arial,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--cream);border:2px dashed var(--line);filter:grayscale(1);opacity:.5}
.badge.on{filter:none;opacity:1;border:2px solid var(--gold);background:#fbf5e6}
.small{font:12px/1.5 Arial,sans-serif;color:var(--muted)}
a.ml{color:var(--wine);text-decoration:none;border-bottom:1px solid #b85c3c66;font:14px Arial,sans-serif}
.foot2{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

body{--ac:#c49a55;--ac2:#e8a56a;background:radial-gradient(circle at 20% 0,#fbf6ea,#f5f0e4 55%,#efe6d2)}
body[data-day=sab]{--ac:#c0586f;--ac2:#6f263d}
body[data-day=dom]{--ac:#8a9a5b;--ac2:#59633b}
.scene{display:block;width:100%;height:auto;min-height:230px;border-radius:20px;box-shadow:0 14px 34px #3b1a2640}
.hero2{position:relative;margin:0 0 16px}
.hero2 .cap{position:absolute;left:0;right:0;top:0;padding:20px 20px 0;color:#fff;text-shadow:0 2px 14px #00000055}
.hero2 .cap .kicker{color:#fff6dc}
.hero2 .cap h2{font-size:34px;margin:6px 0 4px}
.hero2 .cap p{margin:0;font:14px/1.4 Arial,sans-serif;max-width:82%}.hero2.tall .scene{min-height:330px}
.chip2{display:inline-block;background:#ffffff26;backdrop-filter:blur(6px);border:1px solid #ffffff55;border-radius:99px;padding:6px 12px;font:12px Arial,sans-serif;margin-top:10px;color:#fff}
.stop{border-left:6px solid var(--ac);box-shadow:0 6px 16px #3b1a2612;transition:transform .15s}
.stop:active{transform:scale(.985)}
.stop .ic{background:linear-gradient(145deg,#fff,var(--cream));box-shadow:inset 0 0 0 2px var(--ac)}
.stop.done .ic{background:radial-gradient(circle,#f4e3a8,#c49a55);box-shadow:inset 0 0 0 2px #8a6a2a;color:#4a3410;font-weight:700}
.btn{box-shadow:0 8px 18px #b85c3c44}
.btn.wine{box-shadow:0 8px 18px #6f263d44;background:linear-gradient(135deg,#8a2f4c,#6f263d)}
.card{box-shadow:0 8px 22px #3b1a260d}
.opt{transition:transform .12s,background .2s;box-shadow:0 2px 0 var(--line)}
.opt:active:not([disabled]){transform:scale(.985)}
.opt.ok{animation:pop .45s}
.opt.bad{animation:shake .4s}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main>*{animation:rise .35s both}
.mapbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;margin:0 0 14px;box-shadow:0 8px 22px #3b1a260d}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .nd{cursor:pointer}
.mapbox text{font-family:Arial,sans-serif}
.next{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#3b1a26,#6f263d);color:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px;width:100%;text-align:left;border:0;box-shadow:0 10px 24px #3b1a2650}
.next .ic{font-size:30px}
.next small{display:block;font:11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.next b{display:block;font-weight:400;font-size:19px;margin-top:2px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:10px}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;font:700 9px/1.15 Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:10px;border:2px dashed #cfc6b0;color:#b9b09a}
.stamp i{display:block;font-style:normal;font-size:26px;margin-bottom:2px;filter:grayscale(1);opacity:.45}
.stamp.on{border:3px double var(--wine);color:var(--wine);background:radial-gradient(circle,#fff9ee,#f6e7cf);transform:rotate(var(--r));box-shadow:0 0 0 3px #fff9ee,0 0 0 4px #6f263d55;animation:thump .5s both}
.stamp.on i{filter:none;opacity:1}
@keyframes thump{0%{transform:rotate(var(--r)) scale(2);opacity:0}60%{transform:rotate(var(--r)) scale(.9);opacity:1}100%{transform:rotate(var(--r)) scale(1)}}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));z-index:30;transform:translateX(-50%);background:#272820ee;color:#fff;padding:8px 16px;border-radius:99px;font:700 14px Arial,sans-serif;pointer-events:none;animation:fl 1.5s forwards;white-space:nowrap}
.toast b{color:var(--gold)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.sw{border:1px solid #ffffff44;background:#ffffff1c;color:#fff;border-radius:99px;width:34px;height:34px;font-size:15px}
.deck{background:linear-gradient(160deg,#fff9ee,#f6e7cf);border:2px solid var(--gold);border-radius:18px;padding:22px 18px;text-align:center;margin:12px 0;min-height:130px;display:grid;place-items:center;box-shadow:0 10px 24px #c49a5540;animation:pop .4s}
.deck p{font-size:20px;line-height:1.4;color:var(--ink);margin:0}
.deck small{display:block;font:11px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);margin-bottom:8px}
.inst li{margin:6px 0;line-height:1.45}
.inst ol{padding-left:20px;margin:6px 0;font:14px Arial,sans-serif;color:var(--muted)}

.art{display:block;width:100%;height:auto;min-height:150px}
.stophero{position:relative;margin:0 0 14px;border-radius:20px;overflow:hidden;box-shadow:0 14px 34px #3b1a2640}
.stophero .art{min-height:220px}
.stophero .top2{position:absolute;left:12px;top:12px}

.stophero .cap2 h2{margin:2px 0 0;font-size:30px;color:#fff;text-shadow:0 2px 10px #0006}

.swstack{position:relative;height:210px;margin:12px 0}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.match>div{display:grid;gap:8px;align-content:start}
.mt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;font-size:15px;line-height:1.25;box-shadow:0 2px 0 var(--line)}
.mt.sel{border-color:var(--wine);background:#f8e8ee;transform:scale(1.03)}

.cmtx{padding:14px 16px 16px}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw2{width:66px;text-align:center;background:none;border:0;font:11px Arial,sans-serif;color:var(--muted)}

.wheel{width:100%;max-width:270px;display:block;margin:8px auto}

.thumb{display:block;width:96px;height:72px;object-fit:cover;border-radius:10px;margin-top:8px;border:2px solid #fff;box-shadow:0 4px 10px #0003}

.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}

.zoom img{max-width:100%;max-height:70vh;border-radius:14px}

.ring{width:84px;height:84px;flex:none}

.shake{animation:shake .4s}
@media print{.nav,.top{display:none}}
.arcgrid{display:grid;gap:10px;margin-top:10px}
.arcbtn{display:grid;grid-template-columns:54px 1fr;grid-template-rows:auto auto auto;column-gap:12px;text-align:left;border:0;border-radius:18px;padding:14px;background:linear-gradient(135deg,#6f263d,#a8453b);color:#fff;font-family:Arial,sans-serif;box-shadow:0 8px 20px #6f263d44;transition:transform .12s}

.arch{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-size:17px}

@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.arcend .ghost{display:block;width:100%;margin-top:10px;color:#fff;border-color:#fff}
.jr{position:relative;display:flex;gap:6px;overflow-x:auto;padding:26px 4px 8px;margin:14px 0;scrollbar-width:none}
.jr::-webkit-scrollbar{display:none}
.jn{flex:0 0 70px;position:relative;background:none;border:0;padding:0;text-align:center;font-family:Arial,sans-serif}
.jn i{display:flex;width:44px;height:44px;margin:0 auto;border-radius:50%;align-items:center;justify-content:center;background:#fff;border:2px solid var(--line);font-style:normal;font-size:20px;position:relative;z-index:1}
.jn.done i{background:var(--olive);color:#fff;border-color:var(--olive)}
.jn.cur i{border-color:var(--wine);box-shadow:0 0 0 0 #6f263d66;animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px #6f263d00}}
.jn small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.15}
.jn::before{content:'';position:absolute;top:22px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.jn:first-child::before{display:none}
.jn.done::before,.jn.cur::before{background:var(--olive)}
.car{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:22px;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateX(-50%) translateY(-4px)}}
